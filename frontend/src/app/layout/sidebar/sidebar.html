<aside
  class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-gray-100 flex flex-col transition-transform lg:translate-x-0"
  [class]="ouvert() ? 'translate-x-0' : '-translate-x-full'"
>
  <div class="h-16 flex items-center gap-2 px-6 border-b border-gray-100">
    <i class="pi pi-truck text-blue-600"></i>
    <span class="font-semibold tracking-tight">Falco Livraison</span>
  </div>

  <nav class="flex-1 overflow-y-auto p-3 flex flex-col gap-1">
    @for (item of items(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 text-blue-700"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="fermer.emit()"
        class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm text-gray-600 hover:bg-gray-50"
      >
        <i [class]="'pi ' + item.icon"></i>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
