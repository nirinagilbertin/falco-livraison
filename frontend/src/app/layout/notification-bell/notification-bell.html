<button type="button" class="relative p-2 rounded-xl hover:bg-gray-50" (click)="pop.toggle($event)" aria-label="Notifications">
  <i class="pi pi-bell text-lg text-gray-600"></i>
  @if (notif.nonLues() > 0) {
    <span class="absolute top-0.5 right-0.5 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-semibold flex items-center justify-center">
      {{ notif.nonLues() > 99 ? '99+' : notif.nonLues() }}
    </span>
  }
</button>

<p-popover #pop appendTo="body">
  <div class="w-80 max-w-[85vw]">
    <div class="flex items-center justify-between pb-2 border-b border-gray-100">
      <span class="text-sm font-semibold">Notifications</span>
      @if (notif.nonLues() > 0) {
        <button type="button" class="text-xs text-blue-600 hover:underline" (click)="toutLire()">Tout marquer comme lu</button>
      }
    </div>

    @if (notif.items().length === 0) {
      <p class="py-6 text-center text-sm text-gray-400">Aucune notification</p>
    } @else {
      <ul class="max-h-80 overflow-y-auto divide-y divide-gray-50">
        @for (n of notif.items(); track n.id_notification) {
          <li>
            <button type="button" class="w-full text-left py-2.5 px-1 flex gap-2 rounded-lg hover:bg-gray-50" (click)="lire(n)">
              <span class="mt-1.5 w-2 h-2 rounded-full shrink-0" [class]="n.statut === 'non_lue' ? 'bg-blue-500' : 'bg-transparent'"></span>
              <span class="flex flex-col">
                <span class="text-sm" [class]="n.statut === 'non_lue' ? 'font-medium text-gray-900' : 'text-gray-500'">{{ n.libelle }}</span>
                <span class="text-xs text-gray-400">{{ n.date_creation | date: 'dd/MM/yyyy HH:mm' }}</span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</p-popover>
