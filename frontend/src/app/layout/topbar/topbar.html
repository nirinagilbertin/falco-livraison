<header class="h-16 sticky top-0 z-20 bg-white border-b border-gray-100 flex items-center justify-between px-4 md:px-6">
  <button type="button" class="lg:hidden p-2 rounded-xl hover:bg-gray-50" (click)="ouvrirMenu.emit()" aria-label="Ouvrir le menu">
    <i class="pi pi-bars"></i>
  </button>
  <div class="flex-1"></div>

  <div class="flex items-center gap-2">
    <app-notification-bell />

    <button type="button" class="flex items-center gap-3 pl-3 pr-2 py-1.5 rounded-xl hover:bg-gray-50" (click)="menu.toggle($event)">
      <span class="w-8 h-8 rounded-full bg-blue-600 text-white text-sm font-semibold flex items-center justify-center">
        {{ initiale() }}
      </span>
      <span class="hidden sm:flex flex-col items-start leading-tight">
        <span class="text-sm font-medium">{{ auth.compte()?.nom_utilisateur }}</span>
        <span class="text-xs text-gray-400">{{ roleLabel() }}</span>
      </span>
      <i class="pi pi-angle-down text-gray-400 text-xs"></i>
    </button>
    <p-menu #menu [model]="items" [popup]="true" appendTo="body" />
  </div>
</header>
