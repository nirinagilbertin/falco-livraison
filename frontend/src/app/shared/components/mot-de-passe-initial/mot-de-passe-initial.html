<p-dialog [(visible)]="visible" [modal]="true" [draggable]="false" header="Compte créé" [style]="{ width: '28rem' }">
  <p class="text-sm text-gray-600">
    Transmettez ces identifiants à son titulaire. Le mot de passe n'est affiché qu'une seule fois et devra être changé à la première connexion.
  </p>

  <div class="mt-4 rounded-xl bg-gray-50 border border-gray-100 p-4 text-sm flex flex-col gap-3">
    <div>
      <span class="text-gray-400">Adresse e-mail</span>
      <div class="font-medium">{{ email() }}</div>
    </div>
    <div>
      <span class="text-gray-400">Mot de passe temporaire</span>
      <div class="font-mono font-semibold text-base select-all">{{ motDePasse() }}</div>
    </div>
  </div>

  <div class="flex justify-end gap-2 mt-5">
    <p-button label="Copier le mot de passe" icon="pi pi-copy" severity="secondary" [outlined]="true" (onClick)="copier()" />
    <p-button label="Fermer" (onClick)="visible.set(false)" />
  </div>
</p-dialog>
